    <script>
      ;(function () {
        var root = document.getElementById('root')
        var title = document.getElementById('boot-title')
        var detail = document.getElementById('boot-detail')
        var actions = document.getElementById('boot-actions')

        function showBootError() {
          if (!root || !document.getElementById('boot-screen')) return
          if (title) title.textContent = '页面没有启动成功'
          if (detail) detail.textContent = '可能是微信内置浏览器版本偏旧或网络暂时不稳定。请重新加载；仍然空白时，点右上角用系统浏览器打开。'
          if (actions && !actions.firstChild) {
            var button = document.createElement('button')
            button.type = 'button'
            button.className = 'boot-button'
            button.textContent = '重新加载'
            button.onclick = function () {
              window.location.reload()
            }
            actions.appendChild(button)
          }
        }

        window.addEventListener(
          'error',
          function (event) {
            if (event && event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
              showBootError()
            }
          },
          true,
        )
        window.addEventListener('unhandledrejection', showBootError)
        window.setTimeout(function () {
          if (!document.getElementById('boot-screen')) return
          if (title) title.textContent = '加载时间有点久'
          if (detail) detail.textContent = '网络较慢时可以点下面重新加载；如果一直停在这里，请用手机系统浏览器打开。'
          if (actions && !actions.firstChild) {
            var button = document.createElement('button')
            button.type = 'button'
            button.className = 'boot-button'
            button.textContent = '重新加载'
            button.onclick = function () {
              window.location.reload()
            }
            actions.appendChild(button)
          }
        }, 15000)
      })()
    </script>
